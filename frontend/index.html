<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Pa_mSikA - Malawi's Premium Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=EB+Garamond:wght@500&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet" />
    <script>
      // Set the dark/light class before React mounts so there's no flash of
      // the wrong theme on load.
      (function () {
        try {
          if (localStorage.getItem('pm_theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#fbf8ff] text-[#1a1b22] font-sans antialiased selection:bg-purple-200">
    <div id="root">
      <div id="pm-boot-loader" style="position:fixed;inset:0;background:#fbf8ff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999;font-family:system-ui,sans-serif;">
        <div style="width:48px;height:48px;border:4px solid #ebddff;border-top-color:#5300b7;border-radius:50%;animation:pm-spin 0.8s linear infinite;"></div>
        <div style="color:#5300b7;font-weight:700;font-size:18px;letter-spacing:0.02em;">Pa_mSikA</div>
        <div style="color:#7b7486;font-size:12px;">Loading marketplace...</div>
      </div>
    </div>
    <style>
      @keyframes pm-spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
