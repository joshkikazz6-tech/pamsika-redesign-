###############################################################################
# Pa_mSikA — Nginx Config (Production)
# The React frontend is now built into the `api` container itself (FastAPI
# serves both the SPA and /api/*), so nginx's job here is just to terminate
# TLS in front of it, add compression/security headers, and proxy uploads
# with long-lived caching. If you don't need a reverse proxy in front of the
# single `api` container (e.g. deploying directly to Render), you can skip
# nginx entirely — see backend/README.md.
###############################################################################

upstream backend {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # ── Security headers ──────────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options   "nosniff"                      always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection         "1; mode=block"                always;

    # ── Upload size limit (images up to 50 MB total per request) ──
    client_max_body_size 50M;

    # ── Compression ───────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;
    gzip_min_length 1024;

    # ── Uploaded product images — long cache ────────────────────────
    location /uploads/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Hashed Vite build assets (/assets/*.js, *.css) — long cache ──
    location /assets/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Health check — no access log noise ───────────────────────
    location = /health {
        proxy_pass http://backend/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Everything else (API + SPA index.html) → FastAPI ──────────
    location / {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Cookie forwarding for refresh-token HttpOnly cookie
        proxy_pass_header  Set-Cookie;
        proxy_cookie_path  /api/v1/auth /api/v1/auth;

        client_max_body_size   50M;
        proxy_connect_timeout  30s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}
